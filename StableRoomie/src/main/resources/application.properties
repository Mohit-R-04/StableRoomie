# Exclude MongoDB auto-configuration (not used in production)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

# Database Connection — Neon serverless PostgreSQL required (no H2 fallback)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate Config
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}

# Jackson timezone (for JSON serialization)
spring.jackson.time-zone=Asia/Kolkata

# OAuth2 configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Lazy initialization for faster startup on small App Service plans
spring.main.lazy-initialization=true

# Single admin email — only this account gets the ADMIN dashboard.
# Override with the ADMIN_EMAIL environment variable.
app.admin.email=${ADMIN_EMAIL:mohit2310893@ssn.edu.in}

# Server configuration
server.port=8080
server.servlet.context-path=/
server.forward-headers-strategy=FRAMEWORK

# Logging (warn level for faster startup)
logging.level.org.springframework=WARN
logging.level.web=WARN
logging.level.org.springframework.security=WARN
